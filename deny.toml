# cargo-deny configuration. Run with `cargo deny check`.
#
# Allowlist per issue #9 and CLAUDE.md rule 2 (permissive licenses only):
# MIT, Apache-2.0, BSD-2/3-Clause, ISC, Zlib, Unicode-3.0, Unlicense.
#
# Three crates on the actual x86_64-pc-windows-msvc dependency graph sit
# outside that list (see the comment on issue #9 and THIRD_PARTY_NOTICES.md
# "Licensing note" for how each was found and verified):
#   - option-ext 0.2.0 (via dirs -> dirs-sys): MPL-2.0, weak copyleft.
#   - clipboard-win 5.4.1, error-code 3.4.0: BSL-1.0 (Boost Software
#     License -- OSI-approved permissive; NOT the unrelated Business Source
#     License that shares the abbreviation).
#   - webpki-roots 1.0.9 (via ureq's TLS stack): CDLA-Permissive-2.0.
#
# BSL-1.0 and CDLA-Permissive-2.0 are uncontroversially permissive, so they
# get narrow per-crate exceptions below rather than widening the allowlist
# CLAUDE.md rule 2 states, so anyone reading this file still sees exactly
# which crates needed a judgment call and why. MPL-2.0/option-ext is a real
# (if narrow) copyleft exception and is flagged TEMPORARY: see the tracking
# issue filed alongside this file proposing to drop `dirs` in favor of
# `SHGetKnownFolderPath(FOLDERID_RoamingAppData)` via the `windows` crate
# this project already depends on. The owner decides whether to keep the
# exception or take that route.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]

# Narrow, per-crate exceptions for the three crates above. Each is scoped to
# exactly one crate name so it cannot silently cover an unrelated dependency
# that later happens to carry the same license id.

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]
# TEMPORARY (owner has not yet decided, see the tracking issue filed with
# this file): option-ext is pulled in transitively by the direct dependency
# `dirs` (dirs -> dirs-sys -> option-ext), used only to resolve
# %APPDATA%. MPL-2.0 is file-level weak copyleft; this crate is used
# unmodified and statically linked, not copied from. Remove this exception
# if `dirs` is dropped in favor of `windows::Win32::UI::Shell::
# SHGetKnownFolderPath(FOLDERID_RoamingAppData)`.

[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]
# Boost Software License 1.0, OSI-approved permissive. Transitive via
# `arboard`'s Windows clipboard backend.

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]
# Boost Software License 1.0, OSI-approved permissive. Transitive via
# `clipboard-win` (see above).

[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
# Community Data License Agreement, Permissive 2.0. Covers only the bundled
# Mozilla root certificate data, pulled in transitively through `ureq`'s
# `rustls` TLS stack.

[bans]
# Duplicate-major-version warnings only: this is a small, actively-changing
# crate tree (rustls/windows-sys pull in more than one major version of
# several transitive crates) and failing CI on that is noise, not a real
# problem, until it is.
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
