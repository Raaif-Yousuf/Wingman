# Deterministic linking for reproducible release builds (issue #137).
#
# MSVC's link.exe embeds two non-deterministic values on every link, neither
# of which SOURCE_DATE_EPOCH or `--remap-path-prefix` touches (those are
# rustc/source-level knobs, not link.exe's):
#   - the PE COFF header's TimeDateStamp (the current wall-clock time), and
#   - the CodeView debug directory's PDB GUID (random, must match the .pdb
#     link.exe writes alongside the .exe).
# `/Brepro` replaces both with values derived from the binary's own
# content instead. MEASURED 2026-09-17: two clean `cargo build --release`
# runs from two different source directories (matching SOURCE_DATE_EPOCH,
# --locked, CARGO_INCREMENTAL=0, matching --remap-path-prefix) produced a
# wingman.exe that differed in exactly 20 of 1,888,256 bytes, clustered at
# the COFF timestamp and the PDB GUID; with `/Brepro` added, both builds
# produced byte-for-byte identical output (same SHA256, same size, 0 bytes
# differing). See docs/reproducible-builds.md for the full measurement and
# how to reproduce it.
#
# Filtered `cargo test` runs were re-checked with this flag present and
# still pass (it only changes link.exe's output, not what compiles or
# runs); see docs/reproducible-builds.md's "What this does not affect"
# section.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]

# Bundled SQLite (the local store, issue #46). libsqlite3-sys compiles the
# amalgamation with FTS5 on (the knowledge track needs it) plus several things
# Wingman never uses. These flags switch those off to keep the release exe
# small: no loadable extensions, no R-tree, no FTS3, no
# STAT4, no soundex, no dbstat, no shared cache or progress callback, no
# deprecated APIs, no memory statistics. MEASURED 2026-10-15: they save about
# 200 KB of a 3.51 MB release exe. FTS5 and triggers must stay available; the
# `fts5_is_compiled_in` test in src/store/mod.rs guards the first.
# `force = true`: a LIBSQLITE3_FLAGS already set in someone's shell must not
# change the compile options of the shipped exe (docs/reproducible-builds.md).
# #771: also off, because nothing in the store uses them: column metadata,
# memory management, tracing, UTF-16 entry points, authorizer callbacks,
# sqlite3_get_table, sqlite3_complete, column decltype and the Tcl variable
# syntax. MEASURED 2026-10-16: about 9.7 KB (3,993,600 to 3,983,872 bytes).
# Tried and dropped: OMIT_EXPLAIN, OMIT_ANALYZE and OMIT_BTREECOUNT together
# stop the amalgamation compiling.
# Also tried and dropped (#1095, MEASURED 2026-10-17): OMIT_WINDOWFUNC stops the
# amalgamation compiling here (error C2039: pWinDefn is not a member of Select).
# #1095: SQL JSON functions are off too (MEASURED 2026-10-15: about 36 KB). No
# SQL in src/ uses json_extract, json_each or the -> operators; JSON is read
# in Rust with serde_json. A later slice that wants them turns this flag back
# off (drop -DSQLITE_OMIT_JSON).
[env]
LIBSQLITE3_FLAGS = { force = true, value = "-DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_PROGRESS_CALLBACK -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_DEFAULT_MEMSTATUS=0 -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_STAT4 -USQLITE_SOUNDEX -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_OMIT_TRACE -DSQLITE_OMIT_UTF16 -DSQLITE_OMIT_AUTHORIZATION -DSQLITE_OMIT_GET_TABLE -DSQLITE_OMIT_COMPLETE -DSQLITE_OMIT_DECLTYPE -DSQLITE_OMIT_TCL_VARIABLE -DSQLITE_OMIT_JSON" }
