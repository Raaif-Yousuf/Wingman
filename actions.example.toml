[[actions]]
id = "add-to-calendar"
name = "Add event from screen"
group = "Work"
inputs = ["screen"]
proposal = "calendar_event"
executor = "calendar_add"
confirm = true
prompt = """You are shown a screenshot of the user's screen. Find the ONE calendar event described or shown on screen (an email, a chat message, an invite, a flyer, a webpage, and so on) and extract it: its title, start time, end time if one is shown, location and any short notes worth keeping. If the screen shows more than one event, pick the one that is the clear focus of the screen (e.g. an open invite or the top message), not a list entry glimpsed in the background. Use plain text only in every field: no markdown (no asterisks, backticks, headers or bullet characters), no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead)."""
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "auto"

[[actions]]
id = "review-this-email"
name = "Review this email"
group = "Writing"
inputs = [
    "uia",
    "selection",
    "screen",
]
proposal = "text_review"
executor = "replace_text"
confirm = true
prompt = """You are shown the text of an email the user is writing (or, if no compose box could be read directly, a screenshot of one). Proofread it: fix spelling and grammar mistakes, and flag anything that reads as unintentionally harsh or unclear in tone. For each individual problem, propose one edit: the EXACT original text to find ("before"), what it should become ("after"), and a short reason. Keep each edit as small and specific as possible -- one edit per individual mistake (e.g. one misspelled word), never one edit spanning an entire sentence or paragraph just because it contains more than one mistake. Only propose an edit for a real problem -- never rewrite text that is already fine just to have something to say, and never propose an edit whose "after" is identical to its "before": if there is nothing to change, do not propose that edit at all. If nothing needs fixing, set "verdict" to "good_to_go" and leave "edits" empty. Otherwise set "verdict" to "needs_edits". Separately, note the overall tone in one short sentence ("tone_note"), and set "missing_attachment" to true only when the text itself mentions an attachment (e.g. "see attached", "I've attached") since you cannot see whether a real attachment is present -- this is a heuristic on the wording alone, not a real attachment check. Never suggest sending, submitting or otherwise finishing the email; only propose edits to its text. Use plain text only in every field: no markdown (no asterisks, backticks, headers or bullet characters), no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead)."""
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "auto"

[[actions]]
id = "fill-this-form"
name = "Fill this form"
group = "Work"
inputs = [
    "uia",
    "screen",
]
proposal = "form_fill"
executor = "fill_form"
confirm = true
prompt = 'You are shown a screenshot of a form and a short list of its fields Wingman could not confidently map to a profile field by label alone. For each one, decide whether a profile field (named below) is the right source, or whether you can read/infer a short, literal value directly from what is visible on screen. Never invent personal data that is not visible and not in the profile. Never fill a payment field (card number, CVV, expiry, IBAN, account or routing number) by any means; leave it as "skip". If you are unsure, choose "skip" rather than guessing. Use plain text only in every field: no markdown (no asterisks, backticks, headers or bullet characters), no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead).'
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "auto"
