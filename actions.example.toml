[[actions]]
id = "action-items-checklist"
name = "Action items to checklist"
group = "Work"
inputs = [
    "selection",
    "screen",
]
proposal = "action_items"
executor = "clipboard"
confirm = true
prompt = """You are shown notes, an email thread, a chat message or a project page (as text, or as a screenshot if no text was selected). Find the action items: things a named person, or the reader, has to do. Return them in `items`, one short plain-text line per action item, in the order they appear, written as "Owner: task (due)". Use the owner's name exactly as shown; write "Me" when the text assigns it to the reader or to nobody in particular. Add the "(due)" part only when the screen states a date or deadline for that item, and copy it as written (for example "Fri" or "Oct 3"); never work out, guess or invent a date, and leave it off when none is shown. Do not include items that are already marked done, decisions, or general discussion. If there are no action items, return an empty list. Do not add bullets, numbers or checkbox characters: they are added for you. Use plain text only: no markdown, no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead)."""
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "auto"

[[actions]]
id = "explain-this-error"
name = "Explain this error"
group = "Work"
inputs = [
    "selection",
    "screen",
]
proposal = "error_explanation"
executor = "none"
confirm = false
prompt = 'You are shown an error message: an error dialog, a stack trace, a failed build or a log line, as text or as a screenshot of the screen. Find the error and explain it to someone who has not seen it before. Fill the fields in this order. meaning: what the error means, in one plain sentence of at most 85 characters. cause: the most likely cause, in one or two sentences. fix: the first thing to try, in one or two sentences, with a command or setting name when there is one. Quote error codes and file names exactly as shown and never invent one. If several errors are visible, explain the one in the foreground dialog or the first one in the trace. If you are not sure of the cause, say so in the cause field rather than guessing. If no error is visible, say so in meaning and write "None" in cause and fix. Use plain text only in every field: no markdown (no asterisks, backticks, headers or bullet characters), no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead).'
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "auto"

[[actions]]
id = "define-this-word"
name = "Define this word"
group = "Study"
inputs = ["selection"]
proposal = "word_definition"
executor = "none"
confirm = false
prompt = 'You are given a word or short phrase the user selected. Define it for a general reader. Fill the fields in this order. definition: the word as written, its part of speech in brackets, a colon, then a plain definition in one short sentence, at most 90 characters in total (for example "ephemeral (adjective): lasting a very short time"). example: one short sentence that uses the word naturally. If the selection has several common meanings, give the most common one. If it is an idiom or phrase, define the phrase. If the selection is a long passage, define only its single hardest word. If it is not a real word or phrase, say so in definition and write "None" in example. Never invent a meaning. Use plain text only in every field: no markdown (no asterisks, backticks, headers or bullet characters), no LaTeX, and no em dashes (use a full stop, a colon, or the word "and" or "but" instead).'
rate_difficulty = false
enabled = true

[actions.prefer]
mode = "local"
