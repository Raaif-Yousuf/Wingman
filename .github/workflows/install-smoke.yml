name: Install smoke

# Installs the release build the two ways a person would (the zip from the
# README, and install.ps1's sparse package), starts it, checks it is up and
# wrote an owner-only config, quits it and removes it (issue #128). It needs
# no API key and no network model.
#
# It runs on pull requests that touch what it exercises, and by hand. It is
# not in ci.yml on purpose: it installs a package and a certificate on the
# runner, and most pull requests cannot change what it checks.
on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'uninstall.ps1'
      - 'packaging/**'
      - 'scripts/install-smoke*'
      - '.github/workflows/install-smoke.yml'
      - 'src/portable.rs'
      - 'src/single_instance.rs'
      - 'src/hotkey.rs'
      - 'src/config.rs'
      - 'src/owner_acl.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  install-smoke:
    name: zip install, sparse install, uninstall
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release

      - name: Zip install (unzip, run, config, quit)
        shell: pwsh
        run: ./scripts/install-smoke.ps1 -Mode Zip

      - name: DIAGNOSTIC trust a certificate from a child powershell.exe
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Import-Module ./packaging/Wingman.Common.psm1 -Force
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=diag, O=Diag' -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $cer = Join-Path $env:RUNNER_TEMP 'diag.cer'
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null
          $a = Get-ElevatedPowerShellArgumentList -Data @{ CerPath = $cer } -Script 'Import-Certificate -FilePath $CerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null'
          "--- direct, inherited PSModulePath"
          & powershell.exe @a 2>&1 | Out-String; "exit=$LASTEXITCODE"
          "--- RunAs"
          try { $p = Start-Process powershell.exe -Verb RunAs -Wait -PassThru -ArgumentList $a; "runas exit=$($p.ExitCode)" } catch { "runas threw: $_" }
          "--- direct with PSModulePath cleared"
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath','Machine')
          & powershell.exe @a 2>&1 | Out-String; "exit=$LASTEXITCODE"
          "--- direct from Windows PowerShell as the parent"
          powershell.exe -NoProfile -Command "Import-Certificate -FilePath '$cer' -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null; 'ok'" 2>&1 | Out-String

      # install.ps1 self-elevates once to trust its self-signed certificate;
      # on a runner that is already an administrator. Runs even when the zip
      # step failed, so one run reports both.
      - name: Sparse install (install.ps1, run, config, quit, uninstall.ps1)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/install-smoke.ps1 -Mode Sparse
