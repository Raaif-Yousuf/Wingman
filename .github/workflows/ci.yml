name: CI

# Runs on every push to master and every pull request (owner decision
# 2026-09-24: the repo is public, so standard GitHub-hosted runners are
# free). It was manual-only from 2026-09-17 while the repo was private.
# workflow_dispatch stays so a run can still be started by hand from the
# Actions tab. release.yml stays manual on purpose: a release is a decision.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. Pull requests from forks
# get a read-only token regardless; this makes same-repo runs match them.
permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than "whatever Install-Module resolves today": a runner
  # image can update its preinstalled module set at any time, and a Pester
  # major-version jump (5 -> 6) has changed output/parameter behavior before.
  # scripts/verify-all.sh (the local gate) is the source of truth for what
  # "green" means; these are the versions it was last verified against.
  PESTER_VERSION: '5.9.1'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  ci:
    name: fmt, clippy, test, release build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # WINGMAN_FULL_SUITE=1 is scripts/hooks/block_unfiltered_cargo_test.py's
        # override for the local "never run a bare cargo test" rule
        # (.claude/skills/filing-findings/SKILL.md section 5). That hook is a
        # Claude Code PreToolUse hook; it never runs in CI at all, so this run
        # is not actually blocked without it. Set anyway so this step matches
        # scripts/verify-all.sh's `env WINGMAN_FULL_SUITE=1 cargo test`
        # invocation verbatim, rather than CI and the local gate quietly
        # running two differently-flagged commands that happen to behave the
        # same today.
        run: cargo test --all-targets
        env:
          WINGMAN_FULL_SUITE: '1'

      - name: cargo build --release
        run: cargo build --release

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: wingman-windows-exe
          path: target/release/*.exe
          if-no-files-found: error

  supply-chain:
    # cargo-deny-action is a Docker container action, and GitHub runs those
    # only on Linux runners ("Container action is only supported on Linux",
    # MEASURED 2026-09-24 on the first GitHub run of this workflow). Neither
    # step needs Windows: deny.toml's [graph] targets pin the dependency graph
    # to x86_64-pc-windows-msvc wherever it is evaluated, and gitleaks scans
    # git history, not a build.
    name: cargo deny, gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hooks:
    name: Python hook tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python -m unittest discover -s scripts/hooks/tests -t .
        run: python -m unittest discover -s scripts/hooks/tests -t .

  pester:
    name: Pester (packaging)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every Wingman.Common.Tests.ps1 test either calls pure functions, mocks
      # the cmdlets a phase touches (Mock -ModuleName Wingman.Common), or -- for
      # the two tests that exercise Invoke-MakeAppxPack/Invoke-WingmanSignTool's
      # exit-code handling -- runs a tiny .cmd stub under $TestDrive instead of
      # the real tool. None of the 77 tests shell out to a real makeappx.exe or
      # signtool.exe, so this job needs no Windows SDK install: what
      # windows-latest ships with (or doesn't) is irrelevant here.
      - name: Install Pester ${{ env.PESTER_VERSION }}
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion $env:PESTER_VERSION `
            -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Invoke-Pester -Path packaging
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $r = Invoke-Pester -Path packaging -PassThru -Output Detailed
          "Passed=$($r.PassedCount) Failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0) {
            $r.Failed | ForEach-Object { "failed: $($_.ExpandedName)" }
            exit 1
          }

  pssa:
    name: PSScriptAnalyzer (install.ps1, uninstall.ps1, packaging)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer ${{ env.PSSCRIPTANALYZER_VERSION }}
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION `
            -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Invoke-ScriptAnalyzer (0 Warning/Error required)
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $findings = @()
          foreach ($p in 'install.ps1', 'uninstall.ps1') {
            $findings += Invoke-ScriptAnalyzer -Path $p -Severity Warning, Error
          }
          $findings += Invoke-ScriptAnalyzer -Path packaging -Recurse -Severity Warning, Error
          $findings | ForEach-Object { "$($_.ScriptName):$($_.Line) $($_.RuleName) $($_.Message)" }
          "findings=$($findings.Count)"
          if ($findings.Count -gt 0) { exit 1 }
