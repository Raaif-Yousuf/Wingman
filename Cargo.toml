[package]
name = "wingman"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[[bin]]
name = "wingman"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order: Value::Object is a BTreeMap by default and serializes keys
# alphabetically, so the schema property order the code writes is NOT what
# gets sent. That order is load-bearing -- the model answers in it, and with
# "headline" emitted before "detail" it commits to a verdict before doing the
# arithmetic and contradicts itself. Do not remove this feature.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
# Comment-preserving config writes (#870, src/config_writer.rs): Settings changes one
# field and keeps every comment, unknown key and hand edit in config.toml. (MIT
# OR Apache-2.0, re-verified 2026-10-16.) It shares toml_parser,
# toml_datetime and winnow with `toml` 1.1, so there is no second parser in the
# exe.
toml_edit = "0.25"
base64 = "0.23"
anyhow = "1.0"
# Pinned exactly: src/inputs/web_page.rs connects only to addresses it already
# checked, through ureq's `unversioned::resolver::Resolver`, which ureq says is
# outside semver. The test `the_real_transport_connects_to_the_pinned_address_
# not_to_a_lookup` fails if a newer ureq stops using the hook; bump on purpose.
# No `gzip` feature (#771): it only adds ureq's decompression glue and asks
# servers for compressed bodies, about 18 KB (MEASURED 2026-10-16: 3,983,872 to
# 3,965,440 bytes). flate2 and miniz_oxide stay, png needs them. web_page.rs
# refuses a compressed reply. Do not turn default features back on.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.6"
# Grapheme-cluster boundaries for the options card ellipsis (#1023). (MIT OR
# Apache-2.0), no dependencies of its own.
unicode-segmentation = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# QR decoding (#313): pure Rust, no model, no network. (MIT OR Apache-2.0) AND
# ISC (the ISC part is its port of the quirc detector), re-verified at adoption
# 2026-10-15; its dependency chain is MIT/Apache/Zlib. Default features off:
# the `img` feature only adds a second `image` coupling we do not use.
rqrr = { version = "0.11", default-features = false }

# card_uia.rs (#654): the `#[implement]` macro the windows crate re-exports
# expands to paths in `windows_core`, so it must be a direct dependency. Same
# version and licence (MIT OR Apache-2.0) as the copy `windows` already pulls in,
# so no new code is built.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  # web_page.rs (#552): MultiByteToWideChar decodes a linked page's declared
  # character set with no extra crate.
  "Win32_Globalization",
  # Issue #216: the Quick Ask palette's row list and query text, via
  # ID2D1HwndRenderTarget + IDWriteTextFormat (palette.rs's `d2d` module).
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  # D2D1_PIXEL_FORMAT's DXGI_FORMAT (issue #216).
  "Win32_Graphics_Dxgi_Common",
  # machine.rs (#328) and ollama_gpu_fix.rs (#382): enumerate DXGI adapters
  # (names, memory, vendor).
  "Win32_Graphics_Dxgi",
  # machine.rs (#328): GetSystemPowerStatus, on demand.
  "Win32_System_Power",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Security_Credentials",
  # dpapi.rs (#62): CryptProtectData/CryptUnprotectData for DPAPI
  # encryption at rest.
  "Win32_Security_Cryptography",
  "Win32_Storage_Packaging_Appx",
  # #81: the knowledge folder watcher (ReadDirectoryChangesW, overlapped).
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  # speech.rs (#77): ISpVoice, the system text-to-speech voice (SAPI).
  "Win32_Media_Speech",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Memory",
  # inputs/selection.rs (#28): CF_UNICODETEXT/CF_HDROP/CF_DIB live under
  # System::Ole in the windows crate, not System::DataExchange (which only
  # has the clipboard *functions*, taking/returning plain u32 format ids).
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  # inputs/page_text.rs (#104): the VARIANT a UIA property condition takes.
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  # Issue #30 (OCR): RoInitialize/RoUninitialize, to give the calling
  # worker thread a WinRT apartment before touching any Windows.Media.Ocr
  # type -- without this, activating OcrEngine or DataWriter fails.
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  # ui/file_dialog.rs (#117): GetOpenFileNameW / GetSaveFileNameW for sharing an action as a file.
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Issue #30 (OCR): Windows.Media.Ocr over a captured Shot.
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

# Issue #30 (OCR): IAsyncOperation::Status/GetResults/Cancel and AsyncStatus
# are generated as types from this separate crate, not re-exported under
# windows::Foundation in 0.62 -- naming AsyncStatus (for a bounded poll loop
# instead of the unbounded Async::join()) needs it as a direct dependency.
# Already pinned by Cargo.lock at 0.3.2 via `windows` itself, so this adds
# no new download.
[dependencies.windows-future]
version = "0.3"
default-features = false
features = ["std"]

[dev-dependencies]
# #203: drives tests/compile_fail.rs, which proves `ui::confirm::Confirmed`'s
# field-privacy boundary actually fails to compile if it is ever widened,
# instead of only being documented in a `compile_fail` doc comment that
# `cargo test` never runs (wingman has no [lib] target, see Cargo.toml's
# [[bin]] section and tests/no_em_dash.rs's own doc comment for the same
# fact). MIT OR Apache-2.0, re-verified at adoption 2026-09-18.
trybuild = "1"
# Test-only: renders QR fixtures for actions::read_qr (#313). Not linked into
# the shipped exe. MIT OR Apache-2.0, re-verified at adoption 2026-10-15.
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Patched copy of rqrr 0.11.0 (#537, #616): the upstream decoder asserts and
# can run for minutes on crafted frames, and a panic aborts the release exe.
# See vendor/rqrr/WINGMAN_PATCHES.md.
[patch.crates-io]
rqrr = { path = "vendor/rqrr" }
