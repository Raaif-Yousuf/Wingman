[package]
name = "wingman"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[[bin]]
name = "wingman"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order: Value::Object is a BTreeMap by default and serializes keys
# alphabetically, so the schema property order the code writes is NOT what
# gets sent. That order is load-bearing -- the model answers in it, and with
# "headline" emitted before "detail" it commits to a verdict before doing the
# arithmetic and contradicts itself. Do not remove this feature.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
base64 = "0.23"
anyhow = "1.0"
ureq = { version = "3.4", features = ["json"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.6"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  # Issue #216: the Quick Ask palette's row list and query text, via
  # ID2D1HwndRenderTarget + IDWriteTextFormat (palette.rs's `d2d` module).
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  # D2D1_PIXEL_FORMAT's DXGI_FORMAT (issue #216).
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Security_Credentials",
  # dpapi.rs (#62): CryptProtectData/CryptUnprotectData for DPAPI
  # encryption at rest.
  "Win32_Security_Cryptography",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Memory",
  # inputs/selection.rs (#28): CF_UNICODETEXT/CF_HDROP/CF_DIB live under
  # System::Ole in the windows crate, not System::DataExchange (which only
  # has the clipboard *functions*, taking/returning plain u32 format ids).
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Accessibility",
  # Issue #30 (OCR): RoInitialize/RoUninitialize, to give the calling
  # worker thread a WinRT apartment before touching any Windows.Media.Ocr
  # type -- without this, activating OcrEngine or DataWriter fails.
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Issue #30 (OCR): Windows.Media.Ocr over a captured Shot.
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

# Issue #30 (OCR): IAsyncOperation::Status/GetResults/Cancel and AsyncStatus
# are generated as types from this separate crate, not re-exported under
# windows::Foundation in 0.62 -- naming AsyncStatus (for a bounded poll loop
# instead of the unbounded Async::join()) needs it as a direct dependency.
# Already pinned by Cargo.lock at 0.3.2 via `windows` itself, so this adds
# no new download.
[dependencies.windows-future]
version = "0.3"
default-features = false
features = ["std"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
