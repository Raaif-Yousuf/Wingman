[package]
name = "wingman"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[[bin]]
name = "wingman"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# preserve_order: Value::Object is a BTreeMap by default and serializes keys
# alphabetically, so the schema property order the code writes is NOT what
# gets sent. That order is load-bearing -- the model answers in it, and with
# "headline" emitted before "detail" it commits to a verdict before doing the
# arithmetic and contradicts itself. Do not remove this feature.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
base64 = "0.23"
anyhow = "1.0"
ureq = { version = "3.4", features = ["json"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.6"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Memory",
  # inputs/selection.rs (#28): CF_UNICODETEXT/CF_HDROP/CF_DIB live under
  # System::Ole in the windows crate, not System::DataExchange (which only
  # has the clipboard *functions*, taking/returning plain u32 format ids).
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
