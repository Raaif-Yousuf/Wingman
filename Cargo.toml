[package]
name = "copilot-ask"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "copilot-ask"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
base64 = "0.23"
anyhow = "1.0"
dirs = "7.0"
ureq = { version = "3.4", features = ["json"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.6"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
